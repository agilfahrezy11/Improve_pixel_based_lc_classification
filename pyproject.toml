[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-lc-classifier"
version = "0.1.0"
description = "Pixel-based land-cover classification workflow"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "rasterio",
    "scikit-learn",
    "lightgbm",
]

[project.optional-dependencies]
boosting = [
    "xgboost",
    "lightgbm",
]
planetary-computer = [
    "planetary-computer",
    "pystac-client",
]

[tool.setuptools.packages.find]
where = ["src"]
