[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-lc-classifier"
version = "0.2.0"
description = "Hybrid pixel-object land-cover classification and post-processing pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
boosting = [
    "lightgbm",
    "xgboost",
]
geo = [
    "geopandas",
]
viz = [
    "matplotlib",
]
experimental = [
    "geopandas",
    "planetary-computer",
    "pystac-client",
]
all = [
    "geopandas",
    "lightgbm",
    "matplotlib",
    "planetary-computer",
    "pystac-client",
    "xgboost",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ML_LC_Classifier*"]
